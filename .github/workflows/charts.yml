name: Update FAA charts index
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths: ["charts/airports.txt"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python charts/build_index.py
      - run: |
          git config user.name "charts-bot"
          git config user.email "charts-bot@users.noreply.github.com"
          git add charts/index.json
          git diff --cached --quiet || git commit -m "Update chart index"
          git push
