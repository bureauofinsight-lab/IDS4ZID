name: Update NOTAMs
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths: ["notams/airports.txt"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python notams/fetch_notams.py
      - run: |
          git config user.name "notam-bot"
          git config user.email "notam-bot@users.noreply.github.com"
          git add notams/index.json
          git diff --cached --quiet || git commit -m "Update NOTAMs"
          git push
